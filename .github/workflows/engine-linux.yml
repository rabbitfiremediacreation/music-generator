# Baut den Modellserver acestep.cpp (Version aus scripts/common.sh) für Linux x86_64 mit Vulkan und veröffentlicht ihn
# als Release „engine-linux-x64-<rev7>“. Die Desktop-App lädt ihn von dort (ENGINE_LINUX_* in scripts/common.sh).
# Gebaut auf Ubuntu 22.04, damit das Paket auch auf älteren Distributionen läuft (glibc 2.35).
name: Linux-Modellserver

on:
  push:
    paths:
      - scripts/build_engine_linux.sh
      - .github/workflows/engine-linux.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Vulkan SDK (LunarG) und Werkzeuge
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc >/dev/null
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq vulkan-sdk cmake ninja-build zip

      - name: Bauen
        run: scripts/build_engine_linux.sh "$RUNNER_TEMP/engine"

      - name: Abhängigkeiten anzeigen
        run: |
          cd "$RUNNER_TEMP/engine"/acestep-cpp-linux-x64-*/
          ldd ace-server
          ls -la

      - name: Paket als Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: engine-linux-x64
          path: |
            ${{ runner.temp }}/engine/*.zip
            ${{ runner.temp }}/engine/*.zip.sha256

      - name: Release anlegen (falls noch nicht vorhanden)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP=$(ls "$RUNNER_TEMP"/engine/acestep-cpp-linux-x64-*.zip)
          REV7=$(basename "$ZIP" .zip | sed 's/.*-//')
          TAG="engine-linux-x64-$REV7"
          SHA=$(cat "$ZIP.sha256")
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG gibt es schon, nichts zu tun. SHA-256 des neuen Builds: $SHA"
            exit 0
          fi
          gh release create "$TAG" "$ZIP" "$ZIP.sha256" --target "$GITHUB_SHA" \
            --title "Modellserver Linux x64 ($REV7)" \
            --notes "acestep.cpp $REV7 für Linux x86_64 mit Vulkan, gebaut auf Ubuntu 22.04 mit scripts/build_engine_linux.sh.

          SHA-256: \`$SHA\`

          Für scripts/common.sh:
          \`\`\`
          ENGINE_LINUX_REV=\"$REV7\"
          ENGINE_LINUX_URL=\"https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$(basename "$ZIP")\"
          ENGINE_LINUX_SHA256=\"$SHA\"
          \`\`\`"
