# Baut die Installationspakete der Desktop-App: Linux (AppImage, deb, rpm), Windows (MSI über WiX), macOS (DMG, Apple
# Silicon). Unsigniert. uv wird je Plattform heruntergeladen und als Beilage („Sidecar“) mitgeliefert.
#
# - Tag `desktop-v<version>` (gleich der Version in desktop/src-tauri/tauri.conf.json): Release-Entwurf mit allen Paketen
# - Push auf den Branch `desktop-pakete`: Probe-Build, Pakete nur als Artefakte
#   (git push origin HEAD:desktop-pakete)
name: Desktop-Pakete

on:
  push:
    tags: ["desktop-v*"]
    branches: ["desktop-pakete"]
  workflow_dispatch:

permissions:
  contents: write

env:
  UV_VERSION: "0.9.18"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            uv_asset: uv-x86_64-unknown-linux-gnu.tar.gz
            bundles: appimage,deb,rpm
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            uv_asset: uv-x86_64-pc-windows-msvc.zip
            bundles: msi
          - os: macos-14
            target: aarch64-apple-darwin
            uv_asset: uv-aarch64-apple-darwin.tar.gz
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Version prüfen (Tag = tauri.conf.json)
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: |
          # Vorabversion wie desktop-v0.1.0-alpha: Zahlenteil vergleichen (MSI erlaubt nur Zahlen in der Version)
          want="${GITHUB_REF_NAME#desktop-v}"; want="${want%%-*}"
          have=$(python3 -c "import json;print(json.load(open('desktop/src-tauri/tauri.conf.json'))['version'])")
          [ "$want" = "$have" ] || { echo "Tag $want ≠ tauri.conf.json $have"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Pakete für WebKitGTK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: uv ${{ env.UV_VERSION }} als Beilage
        shell: bash
        run: |
          mkdir -p desktop/src-tauri/binaries "$RUNNER_TEMP/uv"
          curl -fsSL -o "$RUNNER_TEMP/uv/${{ matrix.uv_asset }}" \
            "https://github.com/astral-sh/uv/releases/download/$UV_VERSION/${{ matrix.uv_asset }}"
          cd "$RUNNER_TEMP/uv"
          case "${{ matrix.uv_asset }}" in
            *.zip) unzip -q "${{ matrix.uv_asset }}" ;;
            *) tar xzf "${{ matrix.uv_asset }}" ;;
          esac
          exe=$(find . -type f \( -name uv -o -name uv.exe \) | head -1)
          ext=""; [ "${exe##*.}" = "exe" ] && ext=".exe"
          cp "$exe" "$GITHUB_WORKSPACE/desktop/src-tauri/binaries/mg-uv-${{ matrix.target }}$ext"
          "$GITHUB_WORKSPACE/desktop/src-tauri/binaries/mg-uv-${{ matrix.target }}$ext" --version

      - name: Bauen
        working-directory: desktop
        run: |
          npm ci
          npx tauri build --bundles ${{ matrix.bundles }} --config src-tauri/tauri.release.conf.json

      - name: Pakete einsammeln
        shell: bash
        run: |
          mkdir -p dist
          b=desktop/src-tauri/target/release/bundle
          find "$b" -maxdepth 2 -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.msi' -o -name '*.dmg' \) -exec cp {} dist/ \;
          ls -la dist
          [ -n "$(ls dist)" ] || { echo "keine Pakete gefunden"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: pakete-${{ matrix.target }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: desktop/RELEASE_NOTES.md
      - name: Release-Text
        run: cp desktop/RELEASE_NOTES.md "$GITHUB_WORKSPACE/notes.md"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release-Entwurf
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          version="${GITHUB_REF_NAME#desktop-v}"
          pre=""; case "$version" in *-*) pre="--prerelease" ;; esac
          title="Music Generator Desktop $version"
          case "$version" in *alpha*) title="Music Generator Desktop ${version%%-*} Alpha" ;; esac
          gh release create "$GITHUB_REF_NAME" * --repo "$GITHUB_REPOSITORY" --draft $pre \
            --title "$title" --notes-file "$GITHUB_WORKSPACE/notes.md"
