[package]
name = "music-generator"
version = "0.1.3"
description = "Desktop-Hülle für den lokalen Music Generator (ACE-Step 1.5 über acestep.cpp)"
license = "MIT"
edition = "2021"
rust-version = "1.82"

[lib]
name = "music_generator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Startseite fest in die Programmdatei einbauen. `tauri dev` schaltet das ab und nutzt seinen Entwicklungsserver;
# ohne dieses Feature sucht auch ein `cargo build` den Entwicklungsserver auf Port 1430.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
dirs = "6"
tauri-plugin-dialog = "2"
ureq = "3"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
sysinfo = { version = "0.37", default-features = false, features = ["system", "disk"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.4"

# gleiche Version wie in Tauri/wry: Mikrofon-Freigabe für die Web-App
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
